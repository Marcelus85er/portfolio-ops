apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-strapi
  labels:
    app: portfolio-strapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-strapi
  template:
    metadata:
      labels:
        app: portfolio-strapi
    spec:
      containers:
      - name: strapi
        image: ghcr.io/marcelus85er/portfolio-ops/portfolio-strapi:1.0.0-beta.3
        ports:
        - containerPort: 1337
        env:
        - name: PORT
          value: "1337"
        - name: HOST
          value: "0.0.0.0"
        # Strapi Database Variables
        - name: DATABASE_CLIENT
          value: "postgres"
        - name: DATABASE_HOST
          value: "postgres" # This fixes the 127.0.0.1 error
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_NAME
          value: "postgres" # Default DB name; update if yours differs
        - name: DATABASE_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD

        # Strapi Required Production Secrets
        - name: APP_KEYS
          value: "yourRandomKey1,yourRandomKey2"
        - name: API_TOKEN_SALT
          value: "yourRandomSalt1"
        - name: ADMIN_JWT_SECRET
          value: "yourRandomJwtSecret1"
        - name: TRANSFER_TOKEN_SALT
          value: "yourRandomSalt2"
        - name: JWT_SECRET
          value: "yourRandomJwtSecret2"
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-strapi
spec:
  selector:
    app: portfolio-strapi
  ports:
    - protocol: TCP
      port: 1337
      targetPort: 1337