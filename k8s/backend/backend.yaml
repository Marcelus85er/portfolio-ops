apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-backend
  labels:
    app: portfolio-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-backend
  template:
    metadata:
      labels:
        app: portfolio-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/marcelus85er/portfolio-ops/portfolio-backend:1.0.0-beta.1
        ports:
        - containerPort: 1337 # Changed from 3000 to match Strapi default
        env:
        # Strapi Database Variables
        - name: DATABASE_CLIENT
          value: "postgres"
        - name: DATABASE_HOST
          value: "postgres" # This fixes the 127.0.0.1 error
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_NAME
          value: "postgres" # Default DB name; update if yours differs
        - name: DATABASE_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD

        # Strapi Required Production Secrets
        - name: APP_KEYS
          value: "yourRandomKey1,yourRandomKey2"
        - name: API_TOKEN_SALT
          value: "yourRandomSalt1"
        - name: ADMIN_JWT_SECRET
          value: "yourRandomJwtSecret1"
        - name: TRANSFER_TOKEN_SALT
          value: "yourRandomSalt2"
        - name: JWT_SECRET
          value: "yourRandomJwtSecret2"

        # MinIO / S3 Variables
        - name: S3_ENDPOINT
          value: "http://minio:9000"
        - name: S3_PUBLIC_URL
          value: "http://localhost:9001"
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: MINIO_ROOT_USER
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: MINIO_ROOT_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-backend
spec:
  selector:
    app: portfolio-backend
  ports:
    - protocol: TCP
      port: 1337
      targetPort: 1337