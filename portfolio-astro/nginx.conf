pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;

    # Match our 50MB backend limit so Nginx doesn't block large assets
    client_max_body_size 50M;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        listen 8080;
        server_name localhost;

        # Stop Nginx from leaking internal ports on redirects
        absolute_redirect off;
        port_in_redirect off;

        # 1. Serve Astro Static HTML UI
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 2. Reverse Proxy for Strapi CMS (/api/)
        location /api/ {
            proxy_pass http://portfolio-backend:1337/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Future Reverse Proxy for Custom Express API (/api-project/)
        # location /api-project/ {
        #     proxy_pass http://portfolio-custom-backend:3000/api-project/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        # }
    }
}